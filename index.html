<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --navy-950:#07152B;
    --navy-900:#0B1F3F;
    --navy-800:#102A54;
    --navy-700:#173A70;
    --azul-600:#1F56A3;
    --azul-500:#2D6BC4;
    --azul-100:#E6EEF9;
    --azul-50:#F2F6FC;
    --ouro:#C9A227;
    --ouro-dark:#9E7E17;
    --ouro-light:#F1E3B3;
    --ouro-soft:#FBF6E6;
    --texto:#14213D;
    --texto-2:#2E3A52;
    --cinza:#5B6477;
    --cinza-claro:#98A1B3;
    --borda:#DDE3EE;
    --fundo:#F3F5F9;
    --branco:#FFFFFF;
    --verde:#1E8E5A;
    --verde-light:#D7F2E4;
    --vermelho:#B83227;
    --vermelho-light:#FBE3E0;
    --alerta:#B86E12;
    --alerta-light:#FDF0DC;
    --sombra:0 2px 12px rgba(11,31,63,0.08);
    --sombra-forte:0 10px 36px rgba(7,21,43,0.22);
    --radius:12px;
    --radius-sm:8px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--fundo); color:var(--texto); font-size:14px; line-height:1.5; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
  :focus-visible{ outline:2px solid var(--ouro); outline-offset:2px; border-radius:4px; }
  .tabular{ font-variant-numeric:tabular-nums; }
  code{ background:var(--azul-50); padding:1px 5px; border-radius:4px; font-size:12px; }

  /* ═════════ LOGIN ═════════ */
  #login-screen{ position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(ellipse at 20% 10%, rgba(201,162,39,0.18), transparent 55%), linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 55%, var(--azul-600) 100%); }
  .login-box{ background:var(--branco); border-radius:var(--radius); box-shadow:var(--sombra-forte); width:100%; max-width:400px; overflow:hidden; }
  .login-top{ background:linear-gradient(135deg, var(--navy-900), var(--navy-700)); padding:26px 28px 20px; text-align:center; border-bottom:3px solid var(--ouro); }
  .login-top img{ width:100%; max-width:300px; height:auto; display:block; margin:0 auto; }
  .login-top .lt{ color:#fff; font-size:20px; font-weight:800; margin-top:16px; letter-spacing:-0.3px; }
  .login-top .ls{ color:var(--ouro-light); font-size:11.5px; text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
  .login-body{ padding:24px 28px 26px; }
  .login-error{ background:var(--vermelho-light); border:1px solid #F1B8B1; color:var(--vermelho); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:14px; }
  .login-hint{ font-size:11.5px; color:var(--cinza-claro); text-align:center; margin-top:16px; line-height:1.6; }

  /* ═════════ HEADER ═════════ */
  header{ background:linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 60%, var(--navy-700) 100%); color:#fff; position:sticky; top:0; z-index:100; box-shadow:0 2px 16px rgba(7,21,43,0.35); }
  .header-inner{ max-width:1300px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:12px 24px; gap:14px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:16px; min-width:0; }
  .brand img{ height:30px; width:auto; display:block; }
  .brand-sep{ width:1px; height:34px; background:rgba(255,255,255,0.25); }
  .brand-title{ font-size:19px; font-weight:800; letter-spacing:-0.4px; line-height:1.1; }
  .brand-sub{ font-size:10.5px; color:var(--ouro-light); letter-spacing:0.8px; text-transform:uppercase; }
  .header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tag{ background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.22); color:#fff; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:0.3px; text-transform:uppercase; white-space:nowrap; }
  .user-pill{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.22); padding:5px 6px 5px 12px; border-radius:20px; font-size:12px; font-weight:600; }
  .user-role-chip{ font-size:10px; text-transform:uppercase; letter-spacing:0.4px; background:var(--ouro); color:var(--navy-950); padding:2px 7px; border-radius:10px; font-weight:800; }
  .btn-logout{ background:rgba(255,255,255,0.14); border:none; color:#fff; font-size:11px; font-weight:700; padding:5px 10px; border-radius:16px; cursor:pointer; font-family:inherit; }
  .btn-logout:hover{ background:rgba(255,255,255,0.26); }
  @media (max-width:640px){
    header{ position:static; }
    .header-inner{ padding:12px 16px; }
    .brand{ gap:10px; }
    .brand img{ height:22px; }
    .brand-sub, .header-right .tag{ display:none; }
    .brand-title{ font-size:16px; }
    .header-right{ width:100%; justify-content:flex-end; }
  }
  .gold-rule{ height:3px; background:linear-gradient(90deg, var(--ouro-dark), var(--ouro), var(--ouro-light), var(--ouro)); }

  .nav-tabs{ background:var(--navy-950); }
  .nav-inner{ max-width:1300px; margin:0 auto; display:flex; overflow-x:auto; padding:0 16px; }
  .nav-tab{ padding:12px 16px; color:#9FB0CC; cursor:pointer; font-size:13px; font-weight:600; border:none; background:none; border-bottom:3px solid transparent; white-space:nowrap; transition:color .15s,border-color .15s; font-family:inherit; }
  .nav-tab:hover{ color:#fff; }
  .nav-tab.active{ color:var(--ouro); border-bottom-color:var(--ouro); }

  /* ═════════ MAIN ═════════ */
  main{ max-width:1300px; margin:0 auto; padding:24px 16px 60px; }
  .page-title{ font-size:22px; font-weight:900; color:var(--navy-900); margin:0 0 4px; letter-spacing:-0.5px; }
  .page-subtitle{ font-size:13px; color:var(--cinza); margin:0 0 20px; max-width:75ch; }
  .divider{ height:1px; background:var(--borda); margin:16px 0; }

  .card{ background:var(--branco); border-radius:var(--radius); box-shadow:var(--sombra); overflow:hidden; border:1px solid #E8ECF4; }
  .card + .card{ margin-top:16px; }
  .card-header{ padding:14px 20px; border-bottom:1px solid var(--borda); display:flex; align-items:center; gap:10px; }
  .card-header h2{ font-size:15px; font-weight:700; color:var(--navy-900); margin:0; }
  .card-header .icon{ width:32px; height:32px; flex:none; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--azul-100); }
  .card-header .icon.gold{ background:var(--ouro-light); }
  .card-header .spacer{ flex:1; }
  .card-body{ padding:20px; }
  .card-note{ font-size:12px; color:var(--cinza-claro); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px){ .grid-2{ grid-template-columns:1fr; } }

  /* ═════════ FORMS ═════════ */
  .form-group{ margin-bottom:16px; }
  .form-group label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--cinza); margin-bottom:6px; }
  .form-group label .opt{ font-size:11px; color:var(--cinza-claro); font-weight:400; text-transform:none; letter-spacing:0; }
  .input-wrap{ position:relative; }
  .input-wrap input, .input-wrap select, .filtro-select, .filtro-input{
    width:100%; padding:11px 14px; border:1.5px solid var(--borda); border-radius:var(--radius-sm); font-size:14px; color:var(--texto);
    background:var(--branco); transition:border-color .2s; outline:none; -webkit-appearance:none; font-family:inherit; }
  .input-wrap input:focus, .input-wrap select:focus, .filtro-input:focus, .filtro-select:focus{ border-color:var(--azul-600); box-shadow:0 0 0 3px rgba(31,86,163,0.12); }
  .input-hint{ font-size:11.5px; color:var(--cinza-claro); margin-top:4px; }

  function calcularFaixa(km){
    const sorted = [...S.faixas].sort((a,b)=>{
      const an = a.limite_km==null?1:0, bn = b.limite_km==null?1:0;
      if(an!==bn) return an-bn;
      return num(a.limite_km) - num(b.limite_km);
    });
    return sorted.find(f => f.limite_km==null || num(f.limite_km) >= km) || sorted[sorted.length-1] || {codigo:'—', rotulo:'—'};
  }

  function custoKmIveco(){ return P('preco_litro')/P('iveco_consumo_km_l') + P('iveco_manutencao_km') + P('iveco_pneus_km') + P('iveco_depreciacao_km') + P('iveco_seguro_doc_km'); }
  function calcularCustosCidade(km){

  async function carregarDados(){
    const [t, f, c, cap] = await Promise.all([
      sb.from('transportadoras').select('id,nome').order('nome'),
      sb.from('faixas_km').select('*').order('ordem'),
      sb.from('cidades').select('id,transportadora_id,regiao_rota,nome,km,dias_coleta,prazo_entrega,prazo_entrega_consolidado').order('nome').limit(5000),
      sb.rpc('capacidades_veiculos'),
    ]);
    for(const r of [t,f,c,cap]) if(r.error) throw r.error;
    S.transportadoras = t.data; S.faixas = f.data;
    S.cidades = c.data.map(x=>({...x, km:num(x.km)}));
    if(cap.data) S.capacidades = {fiorino_kg:num(cap.data.fiorino_kg), iveco_kg:num(cap.data.iveco_kg)};

        sb.from('parametros_custo').select('*').eq('id',1).maybeSingle(),
        sb.from('perfis').select('id,nome,email,papel,ativo,criado_em').order('nome'),

  /* ============ Leitura do PDF do orçamento ============ */
  function numBR(s){
    if(s==null) return null;
    let t = String(s).replace(/[^\d,.\-]/g,'');
    if(!t) return null;
    if(t.includes(',')) t = t.replace(/\./g,'').replace(',', '.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,'');
    const v = parseFloat(t);
    return isNaN(v) ? null : v;
  }
  function agruparLinhas(itens){
    const ord = [...itens].sort((a,b)=> b.y - a.y || a.x - b.x);
    const linhas = [];
    for(const it of ord){
      const l = linhas.find(l => Math.abs(l.y - it.y) <= 3);
      if(l) l.itens.push(it); else linhas.push({y:it.y, itens:[it]});
    }
    linhas.forEach(l => l.itens.sort((a,b)=>a.x-b.x));
    return linhas;
  }
  // Junta pedaços de texto vizinhos na mesma linha em frases (ex.: "Valor" "Unit." "R$").
  function frases(itensLinha){
    const out = [];
    for(const it of itensLinha){
      const last = out[out.length-1];
      if(last && it.x - (last.x + last.w) < 4.5){ last.s += (it.x - (last.x+last.w) > 1 ? ' ' : '') + it.s; last.w = (it.x + it.w) - last.x; }
      else out.push({...it});
    }
    return out;
  }
  function classificarCabecalho(s){
    const t = norm(s);
    if(/peso/.test(t)) return 'peso';
    if(/cod/.test(t)) return 'cod';
    if(/descri/.test(t)) return 'desc';
    if(/unit/.test(t)) return 'vunit';
    if(/total/.test(t)) return 'vtotal';
    if(/^unid|^un\.?$|unidade|^emb/.test(t)) return 'unid';
    if(/quant|qtd|qtde/.test(t)) return 'qtd';
    return null;
  }
  function montarColunas(linha){
    const cols = frases(linha.itens).map(f=>({k:classificarCabecalho(f.s), x:f.x, s:f.s})).filter(c=>c.k);
    const vistos = new Set();
    return cols.filter(c => vistos.has(c.k) ? false : (vistos.add(c.k), true)).sort((a,b)=>a.x-b.x);
  }
  function distribuir(linha, cols){
    const cel = {};
    for(const f of frases(linha.itens)){
      let alvo = null;
      for(let i=0;i<cols.length;i++){
        const ini = cols[i].x - 4, fim = i+1<cols.length ? cols[i+1].x - 4 : Infinity;
        if(f.x >= ini && f.x < fim){ alvo = cols[i].k; break; }
      }
      if(!alvo && cols.length && f.x < cols[0].x) alvo = cols[0].k;
      if(alvo) cel[alvo] = cel[alvo] ? cel[alvo] + ' ' + f.s : f.s;
    }
    return cel;
  }
  function acharNumeroOrcamento(brutos){
    const rot = brutos.find(i => /or[cç]amento/i.test(i.s) && /n[uú]m|n[º°o]\.?/i.test(i.s)) || brutos.find(i => /or[cç]amento/i.test(i.s));
    if(!rot) return null;
    const m = rot.s.match(/(\d{5,})/);
    if(m) return m[1];
    let best=null, bd=Infinity;
    for(const i of brutos){
      if(!/^\d{5,}$/.test(i.s)) continue;
      const d = Math.hypot(i.x - rot.x, (i.y - rot.y)*1.5);
      if(d < bd){ bd = d; best = i.s; }
    }
    return bd < 250 ? best : null;
  }
  function acharCliente(linhas, hdrIdx){
    let ini = -1;
    for(let i=hdrIdx-1;i>=0 && i>=hdrIdx-8;i--){
      if(/abaixo\s*:?$/i.test(linhas[i].itens.map(t=>t.s).join(' ').trim())){ ini = i; break; }
    }
    const partes = [];
    const de = ini>=0 ? ini+1 : Math.max(0, hdrIdx-1);
    for(let i=de;i<hdrIdx;i++) partes.push(linhas[i].itens.map(t=>t.s).join(' ').trim());
    const c = partes.join(' ').replace(/\s+/g,' ').trim();
    return c && c.length <= 120 ? c : null;
  }

  async function lerOrcamentoPdf(file){
    if(!window.pdfjsLib) throw new Error('O leitor de PDF não carregou. Verifique a internet e recarregue a página.');
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    const itens = [];
    let numero = null, cliente = null, cols = null, temPeso = false, fim = false;

    for(let p=1; p<=pdf.numPages && !fim; p++){
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const brutos = tc.items.filter(i=>i.str && i.str.trim()).map(i=>({s:i.str.trim(), x:i.transform[4], y:i.transform[5], w:i.width||0}));
      const linhas = agruparLinhas(brutos);
      if(!numero) numero = acharNumeroOrcamento(brutos);

      const hdrIdx = linhas.findIndex(l => { const t = norm(l.itens.map(i=>i.s).join(' ')); return /cod/.test(t) && /descri/.test(t); });
      if(hdrIdx >= 0){
        cols = montarColunas(linhas[hdrIdx]);
        if(cols.some(c=>c.k==='peso')) temPeso = true;
        if(!cliente) cliente = acharCliente(linhas, hdrIdx);
      }
      if(!cols) continue;

      let ultimoY = null;
      for(let i = hdrIdx>=0 ? hdrIdx+1 : 0; i<linhas.length; i++){
        const l = linhas[i];
        if(l.itens.some(t => /^total\s*:?$/i.test(t.s)) || /^total\s*:/i.test(l.itens.map(t=>t.s).join(' '))){ fim = true; break; }
        const cel = distribuir(l, cols);
        const cod = (cel.cod||'').replace(/\s/g,'');
        if(/^\d{2,}$/.test(cod)){
          const q = numBR(cel.qtd), pu = numBR(cel.peso);
          itens.push({
            codigo: cod, descricao: (cel.desc||'').trim(), unidade: (cel.unid||'').trim(),
            quantidade: q, peso_unit: pu, peso_total: (q!=null && pu!=null) ? +(q*pu).toFixed(3) : null,
            valor_unit: numBR(cel.vunit), valor_total: numBR(cel.vtotal),
          });
          ultimoY = l.y;
        } else if(itens.length && ultimoY!=null && cel.desc && !cel.qtd && Math.abs(ultimoY - l.y) < 16){
          itens[itens.length-1].descricao += ' ' + cel.desc.trim();
          ultimoY = l.y;
        }
      }
    }

    if(!itens.length) throw new Error('Não encontrei a tabela de itens neste PDF. Confira se é o orçamento gerado pelo sistema (com as colunas Cód. item, Descrição, Quantidade…).');
    const avisos = [];
    if(!temPeso) avisos.push('Este PDF ainda não tem a coluna de peso. O peso fica em branco e a simulação considera ' + PESO_PADRAO_KG + ' kg, a menos que você informe o peso manualmente.');
    const semPeso = itens.filter(i => i.peso_total==null).length;
    if(temPeso && semPeso) avisos.push(semPeso + ' item(ns) sem peso ou quantidade legível — não entraram na soma do peso.');
    const pesoTotal = itens.reduce((s,i)=> s + (i.peso_total||0), 0);
    const valorTotal = itens.reduce((s,i)=> s + (i.valor_total||0), 0);
    return { arquivo: file.name, numero, cliente, itens, temPeso, pesoTotal: +pesoTotal.toFixed(3), valorTotal, avisos };
  }

  // ---- Base de Dados ----
  function screenBaseDados(){
    const admin = isAdmin() && S.parametros;
    const q = norm(ui.cidadesQuery.trim());
    const rows = S.cidades.filter(c =>
      (!q || norm(c.nome).includes(q) || norm(c.regiao_rota).includes(q)) &&
      (!ui.cidadesTransp || c.transportadora_id === ui.cidadesTransp)
    ).sort((a,b)=>a.km-b.km);
    const head = `<tr><th>Cidade</th><th>Transportadora</th><th>Região</th><th style="text-align:right;">Km</th><th>Faixa</th><th>Dias coleta</th><th>Prazo</th>
      ${admin ? '<th style="text-align:right;">Custo Fiorino</th><th style="text-align:right;">Custo Iveco</th><th style="text-align:right;">Ped. mín. Fiorino</th><th style="text-align:right;">Ped. mín. Iveco</th><th></th>' : ''}</tr>`;
    const body = rows.map(c=>{
      const f = calcularFaixa(c.km);
      const k = admin ? calcularCustosCidade(c.km) : null;
      return `<tr>
        <td style="font-weight:700;">${esc(c.nome)}</td>
        <td><span class="transp-tag ${transpTagClass(c.transportadora_id)}">${esc(transp(c.transportadora_id).nome)}</span></td>
        <td class="muted">${esc(c.regiao_rota||'—')}</td>
        <td class="currency">${fmtKm(c.km)}</td>
        <td><span class="badge ${faixaClass(f.codigo)}">${esc(f.rotulo)}</span></td>
        <td class="muted wrap">${esc(c.dias_coleta||'—')}</td>
        <td class="muted wrap">${esc(c.prazo_entrega||'—')}${c.prazo_entrega_consolidado?` (consol. ${esc(c.prazo_entrega_consolidado)})`:''}</td>
        ${admin ? `<td class="currency">${fmtBRL(k.ctf)}</td><td class="currency">${fmtBRL(k.cti)}</td><td class="currency">${fmtBRL(k.pmf)}</td><td class="currency">${fmtBRL(k.pmi)}</td>
          <td><div class="btn-row"><button class="btn-icon-sm" onclick="App.openCidadeModal('${c.id}')" title="Editar">✏️</button>
          <button class="btn-icon-sm danger" onclick="App.deleteCidade('${c.id}')" title="Excluir">🗑️</button></div></td>` : ''}
      </tr>`;
    }).join('');
    const transpOptions = S.transportadoras.map(t=>`<option value="${t.id}" ${ui.cidadesTransp===t.id?'selected':''}>${esc(t.nome)}</option>`).join('');
    return `${pageHead('Base de Dados', 'Cidades atendidas, faixa de distância e prazos. Faixa e custo são sempre recalculados a partir dos parâmetros vigentes.')}
      ${!isAdmin() ? `<div class="banner">🔒 Colunas de custo e pedido mínimo ficam visíveis apenas para administradores.</div>` : ''}
      <div class="filtros">
        <input class="filtro-input" placeholder="Buscar cidade ou região…" value="${esc(ui.cidadesQuery)}" oninput="App.setUi('cidadesQuery', this.value, this)" />
        <select class="filtro-select" onchange="App.setUi('cidadesTransp', this.value)"><option value="">Todas as transportadoras</option>${transpOptions}</select>
        ${isAdmin() ? `<button class="btn-outline" onclick="App.openCidadeModal(null)">＋ Nova cidade</button>` : ''}
      </div>
      <p class="card-note" style="margin:-6px 0 10px;">${rows.length} de ${S.cidades.length} cidades</p>
      <div class="tabela-wrap"><table class="main-table"><thead>${head}</thead><tbody>${body || `<tr><td colspan="12"><div class="empty-state">Nenhuma cidade encontrada.</div></td></tr>`}</tbody></table></div>`;
  }

  // ---- Histórico ----
  function screenHistorico(){
    const admin = isAdmin();
    if(!S.historicoCarregado){
      return `${pageHead('Histórico de Simulações', '')}<div class="card"><div class="empty-state"><span class="spin"></span> Carregando histórico…</div></div>`;
    }
    const q = norm(ui.historicoQuery.trim());
    const rows = S.historico.filter(h=>{
      if(ui.historicoVendedor && h.usuario_id !== ui.historicoVendedor) return false;
      if(!q) return true;
      const r = h.resultado || {};
      return norm((r.cidade||{}).nome).includes(q) || norm(h.cliente).includes(q) || norm(h.numero_orcamento).includes(q);
    });
    const vendOpts = admin ? S.perfis.map(p=>`<option value="${p.id}" ${ui.historicoVendedor===p.id?'selected':''}>${esc(p.nome)}</option>`).join('') : '';
    const body = rows.map(h=>{
      const r = h.resultado || {};
      return `<tr>
        <td class="muted">${fmtDate(h.criado_em)}</td>
        ${admin ? `<td>${esc((h.perfis||{}).nome||'—')}</td>` : ''}
        <td>${h.numero_orcamento ? `<strong>${esc(h.numero_orcamento)}</strong>` : '<span class="muted">—</span>'}</td>
        <td class="wrap" style="max-width:220px;">${esc(h.cliente||'—')}</td>
        <td style="font-weight:700;">${esc((r.cidade||{}).nome||'—')}</td>
        <td class="currency">${fmtKm(num(h.km))}</td>
        <td class="currency">${fmtKg(num(h.peso))}${h.peso_padrao?' <span class="muted" title="Peso padrão">(padrão)</span>':''}</td>
        <td class="currency">${h.valor_pedido!=null?fmtBRL(h.valor_pedido):'—'}</td>
        <td>${MODAL_EMOJI[h.modal_vencedor]||''} ${h.modal_vencedor==='transportadora' ? esc((r.cidade||{}).transportadora||'Transportadora') : (MODAL_LABEL[h.modal_vencedor]||h.modal_vencedor)}</td>
        <td class="currency" style="color:var(--navy-800); font-weight:800;">${fmtBRL(h.custo_vencedor)}</td>
        <td><div class="btn-row">
          <button class="btn-icon-sm" onclick="App.openHistoricoModal('${h.id}')" title="Ver detalhes">👁️</button>
          ${admin?`<button class="btn-icon-sm danger" onclick="App.deleteHistorico('${h.id}')" title="Excluir">🗑️</button>`:''}
        </div></td>
      </tr>`;
    }).join('');
    const cols = admin ? 11 : 10;
    return `${pageHead('Histórico de Simulações', admin ? 'Todas as simulações de todos os vendedores. O resultado fica congelado como foi mostrado, mesmo que os parâmetros de custo mudem depois.' : 'Suas simulações salvas. O resultado fica congelado como foi mostrado, mesmo que os parâmetros de custo mudem depois.')}
      <div class="filtros">
        <input class="filtro-input" placeholder="Buscar por cidade, cliente ou nº do orçamento…" value="${esc(ui.historicoQuery)}" oninput="App.setUi('historicoQuery', this.value, this)" />
        ${admin ? `<select class="filtro-select" onchange="App.setUi('historicoVendedor', this.value)"><option value="">Todos os vendedores</option>${vendOpts}</select>` : ''}
        <button class="btn-outline" onclick="App.recarregarHistorico()">↻ Atualizar</button>
      </div>
      <p class="card-note" style="margin:-6px 0 10px;">${rows.length} simulação(ões)</p>
      <div class="tabela-wrap"><table class="main-table"><thead><tr>
        <th>Data</th>${admin?'<th>Vendedor</th>':''}<th>Orçamento</th><th>Cliente</th><th>Cidade</th><th style="text-align:right;">Km</th><th style="text-align:right;">Peso</th>
        <th style="text-align:right;">Valor pedido</th><th>Vencedor</th><th style="text-align:right;">Custo</th><th></th>
      </tr></thead><tbody>${body || `<tr><td colspan="${cols}"><div class="empty-state">Nenhuma simulação registrada ainda. Rode uma no Simulador.</div></td></tr>`}</tbody></table></div>`;
  }

  // ---- Parâmetros ----
  const PCT_FIELDS = ['pct_frota','pct_transp','ad_valorem'];
  function screenParametros(){
    if(!S.parametros) return pageHead('Parâmetros de Custo','Sem parâmetros cadastrados.');
    if(!paramDraft){
      paramDraft = {};
      for(const [k,v] of Object.entries(S.parametros)) paramDraft[k] = PCT_FIELDS.includes(k) ? +(num(v)*100).toFixed(4) : v;
    }
    const p = paramDraft;
    const f = (id, label, step) => `<div class="param-group"><label>${label}</label>
      <input class="param-input" type="number" step="${step||'0.01'}" value="${esc(p[id])}" oninput="App.setParam('${id}', this.value)" /></div>`;
    const quem = (S.perfis.find(x=>x.id===S.parametros.atualizado_por)||{}).nome;
    return `${pageHead('Parâmetros de Custo', 'Linha única usada por todas as simulações. Vendedores nunca leem esta tabela — só recebem o resultado calculado.')}
      <p class="card-note" style="margin-bottom:14px;">Última atualização: ${S.parametros.atualizado_em ? fmtDate(S.parametros.atualizado_em) : '—'}${quem?`, por ${esc(quem)}`:''}.</p>
      <div class="card"><div class="card-header"><div class="icon">🚐</div><h2>Fiorino (frota própria — pequeno)</h2></div><div class="card-body">
        <p class="card-note" style="margin:0 0 12px;">Custo/km = combustível + manutenção + pneus + depreciação + seguro</p>
        <div class="param-grid">${f('fiorino_manutencao_km','Manutenção (R$/km)')}${f('fiorino_pneus_km','Pneus (R$/km)')}${f('fiorino_depreciacao_km','Depreciação (R$/km)')}${f('fiorino_seguro_km','Seguro (R$/km)')}${f('fiorino_consumo_km_l','Consumo (km/litro)','0.1')}${f('fiorino_capacidade_kg','Capacidade (kg)','1')}</div>
      </div></div>
      <div class="card"><div class="card-header"><div class="icon">🚛</div><h2>Iveco Tector (frota própria — grande)</h2></div><div class="card-body">
        <p class="card-note" style="margin:0 0 12px;">Custo/km = combustível + manutenção + pneus + depreciação + seguro/documentação</p>
        <div class="param-grid">${f('iveco_manutencao_km','Manutenção (R$/km)')}${f('iveco_pneus_km','Pneus (R$/km)')}${f('iveco_depreciacao_km','Depreciação (R$/km)')}${f('iveco_seguro_doc_km','Seguro + doc. (R$/km)')}${f('iveco_consumo_km_l','Consumo (km/litro)','0.1')}${f('iveco_capacidade_kg','Capacidade (kg)','1')}</div>
      </div></div>
      <div class="card"><div class="card-header"><div class="icon gold">⚙️</div><h2>Gerais</h2></div><div class="card-body">
        <div class="param-grid">${f('preco_litro','Preço do litro (R$)')}${f('pct_frota','Teto do frete próprio (%)','0.1')}${f('pct_transp','% cobrado pela transportadora','0.1')}${f('frete_min','Frete mínimo (R$)')}${f('ad_valorem','Ad valorem (%)','0.001')}${f('preco_volume','Preço por volume (R$)')}</div>
      </div></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn-primary" ${ui.busy?'disabled':''} onclick="App.saveParametros()">${ui.busy?'<span class="spin"></span>Salvando…':'💾 Salvar parâmetros'}</button>
        <button class="btn-outline" onclick="App.descartarParametros()">Descartar alterações</button>
      </div>`;
  }

  // ---- Cadastros ----
  function screenCadastros(){
    const tab = ui.cadastroTab;
    const tabs = `<div class="subtabs">
      <button class="subtab ${tab==='transportadoras'?'active':''}" onclick="App.setUi('cadastroTab','transportadoras')">Transportadoras</button>
      <button class="subtab ${tab==='faixas'?'active':''}" onclick="App.setUi('cadastroTab','faixas')">Faixas de distância</button>
    </div>`;
    let body;
    if(tab==='transportadoras'){
      const rows = S.transportadoras.map(t=>{
        const n = S.cidades.filter(c=>c.transportadora_id===t.id).length;
        return `<tr><td style="font-weight:700;"><span class="transp-tag ${transpTagClass(t.id)}">${esc(t.nome)}</span></td><td class="muted">${n} cidade(s)</td>
          <td><div class="btn-row"><button class="btn-icon-sm" onclick="App.renameTransportadora('${t.id}')" title="Renomear">✏️</button>
          <button class="btn-icon-sm danger" onclick="App.deleteTransportadora('${t.id}')" title="Excluir">🗑️</button></div></td></tr>`;
      }).join('');
      body = `<div class="tabela-wrap"><table class="main-table"><thead><tr><th>Nome</th><th>Uso</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        <button class="btn-outline" style="margin-top:12px;" onclick="App.addTransportadora()">＋ Nova transportadora</button>`;
    } else {
      const rows = [...S.faixas].sort((a,b)=>a.ordem-b.ordem).map(f=>`<tr>
        <td class="muted">${f.ordem}</td>
        <td><span class="badge ${faixaClass(f.codigo)}">${esc(f.codigo)}</span></td>
        <td><input class="filtro-input" style="width:200px; min-width:0;" value="${esc(f.rotulo)}" onchange="App.setFaixaField('${f.id}','rotulo',this.value)"/></td>
        <td style="text-align:right;">${f.limite_km==null ? '<span class="muted">sem limite</span>' :
          `<input class="filtro-input tabular" style="width:110px; min-width:0; text-align:right;" type="number" min="1" value="${num(f.limite_km)}" onchange="App.setFaixaField('${f.id}','limite_km',this.value)"/>`}</td>
      </tr>`).join('');
      body = `<p class="card-note" style="margin:0 0 12px;">Alterar um limite recalcula a faixa de todas as cidades imediatamente. As alterações são salvas ao sair do campo.</p>
        <div class="tabela-wrap"><table class="main-table"><thead><tr><th>Ordem</th><th>Código</th><th>Rótulo</th><th style="text-align:right;">Limite (km)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    return `${pageHead('Cadastros', 'Transportadoras parceiras e faixas de distância usadas em toda a base de cidades.')}${tabs}${body}`;
  }

      const self = p.id === S.perfil.id;
      return `<tr>
        <td style="font-weight:700;">${esc(p.nome)} ${self?'<span class="muted">(você)</span>':''}</td>
        <td class="muted">${esc(p.email||'—')}</td>
        <td><span class="role-badge ${p.papel}">${p.papel}</span></td>

      <div class="filtros"><button class="btn-primary" style="font-size:13px; padding:10px 16px;" onclick="App.openUserModal(null)">＋ Novo usuário</button></div>
      <div class="tabela-wrap"><table class="main-table"><thead><tr><th>Nome</th><th>E-mail (login)</th><th>Papel</th><th>Status</th><th>Desde</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6"><div class="empty-state">Nenhum usuário.</div></td></tr>`}</tbody></table></div>
      <p class="card-note" style="margin-top:10px;">Para bloquear alguém, edite e desmarque “Acesso liberado”. O histórico dessa pessoa continua guardado.</p>`;

          <tr><td>🚛 Iveco Tector</td><td class="num">${r.iveco?fmtBRL(r.iveco.custo_total):'—'}</td><td>${statusHtml(r.iveco && r.iveco.selo)}</td></tr>
          <tr><td>🏢 Transportadora</td><td class="num">${r.transportadora && r.transportadora.custo!=null?fmtBRL(r.transportadora.custo):'—'}</td><td>${statusHtml(r.transportadora && r.transportadora.selo)}</td></tr>
          ${r.volume?`<tr><td>📦 Por volume</td><td class="num">${fmtBRL(r.volume.custo)}</td><td class="muted">${r.volume.quantidade} vol.</td></tr>`:''}

  /* ============ Login ============ */
  function screenLogin(){
    return `<div id="login-screen"><div class="login-box">
      <div class="login-top">
        <img src="${LOGO}" alt="Antares Distribuidora · Mega Hospitalar" />
        <div class="lt">SimuFrete</div>

  function screenNovaSenha(){
    const r = recuperacao;
    return `<div id="login-screen"><div class="login-box">
      <div class="login-top">
        <img src="${LOGO}" alt="Antares Distribuidora · Mega Hospitalar" />
        <div class="lt">Definir nova senha</div>
        <div class="ls">SimuFrete</div>
      </div>
      <div class="login-body">
        ${r.erro ? `<div class="login-error">${esc(r.erro)}</div>` : ''}

  /* ============ Render ============ */
  const NAV = [
    {id:'simulador', label:'Simulador', emoji:'🧮'},
    {id:'base', label:'Base de Dados', emoji:'📂'},
    {id:'historico', label:'Histórico', emoji:'🕓'},
    {id:'parametros', label:'Parâmetros', emoji:'⚙️', admin:true},
    {id:'cadastros', label:'Cadastros', emoji:'🏢', admin:true},
    {id:'usuarios', label:'Usuários', emoji:'👥', admin:true},
  ];

  function render(){
    const app = document.getElementById('app');
    if(S.boot){ app.innerHTML = `<div class="loading-screen"><span class="spin" style="width:26px;height:26px;"></span>Carregando SimuFrete…</div>`; return; }
    if(recuperacao){ app.innerHTML = screenNovaSenha(); return; }
    if(!S.perfil){
      app.innerHTML = screenLogin();
      const uf = document.getElementById(loginForm.email ? 'login-pass' : 'login-user');
      if(uf && !loginForm.loading && document.activeElement===document.body) uf.focus();
      return;
    }
    const admin = isAdmin();
    if(NAV.find(n=>n.id===S.route && n.admin) && !admin) S.route = 'simulador';
    let screenHtml;
    switch(S.route){
      case 'base': screenHtml = screenBaseDados(); break;
      case 'historico': screenHtml = screenHistorico(); break;
      case 'parametros': screenHtml = screenParametros(); break;
      case 'cadastros': screenHtml = screenCadastros(); break;
      case 'usuarios': screenHtml = screenUsuarios(); break;
      default: screenHtml = screenSimulador();
    }
    const navHtml = NAV.filter(i=>!i.admin || admin).map(item=>
      `<button class="nav-tab ${S.route===item.id?'active':''}" onclick="App.go('${item.id}')">${item.emoji} ${item.label}</button>`).join('');

    app.innerHTML = `
      <header>
        <div class="header-inner">
          <div class="brand">
            <img src="${LOGO}" alt="Antares Distribuidora · Mega Hospitalar" />
            <div class="brand-sep"></div>
            <div><div class="brand-title">SimuFrete</div><div class="brand-sub">Simulador de custo logístico</div></div>
          </div>
          <div class="header-right">
            <span class="tag">${S.cidades.length} cidades</span>
            <div class="user-pill"><span>${esc(S.perfil.nome)}</span><span class="user-role-chip">${esc(S.perfil.papel)}</span>
              <button class="btn-logout" onclick="App.logout()">Sair</button></div>
          </div>
        </div>
        <div class="gold-rule"></div>
        <nav class="nav-tabs"><div class="nav-inner">${navHtml}</div></nav>
      </header>
      <main>
        ${screenHtml}
        <footer class="about-note">SimuFrete · Antares Distribuidora e Mega Hospitalar · dados salvos com segurança no servidor.</footer>
      </main>
      ${ui.modal==='cidade' ? renderCidadeModal() : ''}
      ${ui.modal==='user' ? renderUserModal() : ''}
      ${ui.modal==='historico' ? renderHistoricoModal(S.historico.find(h=>h.id===ui.historicoId)) : ''}
    `;
  }

  function refocus(el){
    if(!el || !el.id) return;
    const n = document.getElementById(el.id);
    if(n){ const pos = el.selectionStart; n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
  }

  /* ============ Ações ============ */
  window.App = {
    async go(route){
      S.route = route; ui.comboOpen = false; render();
      if(route==='historico' && !S.historicoCarregado){
        try{ await carregarHistorico(); }catch(e){ toast(erroMsg(e),'error'); }
        render();
      }
      if(route==='parametros') paramDraft = null;
    },
    setUi(k, v, el){
      ui[k] = v;
      const id = el && el.id;
      render();
      if(el){ const inputs = document.querySelectorAll('.filtro-input'); const n = inputs[0]; if(n){ n.focus(); n.setSelectionRange(v.length, v.length); } }
    },

    setLoginField(field, val){ loginForm[field] = val; if(loginForm.erro){ loginForm.erro=''; } },
    async doLogin(){
      // Lê direto dos campos: o preenchimento automático do navegador nem sempre dispara o evento "input".
      const elEmail = document.getElementById('login-user'), elSenha = document.getElementById('login-pass');
      if(elEmail) loginForm.email = elEmail.value;
      if(elSenha) loginForm.senha = elSenha.value;
      const email = loginForm.email.trim(), senha = loginForm.senha;
      if(!email || !senha){ loginForm.erro = 'Informe e-mail e senha.'; render(); return; }
      loginForm.loading = true; loginForm.erro = ''; render();
      lsSet(LS_LEMBRAR, loginForm.lembrar ? '1' : '0');
      try{
        const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
        if(error) throw error;
        await iniciarSessao(data.session);
        lsSet(LS_EMAIL, loginForm.lembrar ? email : null);
        loginForm = { email: loginForm.lembrar ? email : '', senha:'', erro:'', loading:false, lembrar: loginForm.lembrar };
        S.route = 'simulador';
      }catch(e){
        loginForm.erro = erroMsg(e); loginForm.senha = ''; loginForm.loading = false;
      }
      render();
    },
    async esqueciSenha(){
      const el = document.getElementById('login-user');
      const email = ((el && el.value) || loginForm.email || '').trim();
      loginForm.email = email; loginForm.erro = ''; loginForm.info = '';
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ loginForm.erro = 'Digite o seu e-mail completo no campo acima e clique de novo em "Esqueci minha senha".'; render(); return; }
      loginForm.loading = true; render();
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      loginForm.loading = false;
      if(error) loginForm.erro = /rate limit|seconds/i.test(error.message) ? 'Aguarde um minuto antes de pedir outro e-mail.' : erroMsg(error);
      else loginForm.info = `Se ${email} tiver cadastro, você vai receber um e-mail com o link para criar uma nova senha. Abra o link neste mesmo computador. Veja também a caixa de spam.`;
      render();
    },
    async salvarNovaSenha(){
      const s1 = document.getElementById('nova-senha').value, s2 = document.getElementById('nova-senha2').value;
      if(s1.length < 6){ recuperacao.erro = 'A senha precisa ter pelo menos 6 caracteres.'; render(); return; }
      if(s1 !== s2){ recuperacao.erro = 'As duas senhas não são iguais.'; render(); return; }
      recuperacao.loading = true; recuperacao.erro = ''; render();
      try{
        const { data, error } = await sb.auth.updateUser({ password: s1 });
        if(error) throw error;
        history.replaceState(null, '', location.pathname);
        recuperacao = null;
        const { data: sess } = await sb.auth.getSession();
        await iniciarSessao(sess.session);
        toast('Senha alterada. Bem-vindo(a)!', 'success');
      }catch(e){
        if(recuperacao){ recuperacao.loading = false; recuperacao.erro = erroMsg(e); }
        else { loginForm.erro = erroMsg(e); }
      }
      render();
    },
    async logout(){
      await sb.auth.signOut();
      Object.assign(S, { session:null, perfil:null, parametros:null, perfis:[], historico:[], historicoCarregado:false, route:'simulador' });
      simResult = null; anexo = null; simForm = {cidadeId:null, cidadeQuery:'', peso:'', valor:'', volumes:''};
      render();
    },

    // --- anexo ---
    escolherPdf(){ const inp = document.getElementById('pdf-input'); inp.value=''; inp.click(); },
    async onPdf(file){
      if(!file) return;
      if(!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf'){ toast('Escolha um arquivo PDF.', 'error'); return; }
      lendoPdf = true; render();
      try{
        anexo = await lerOrcamentoPdf(file);
        if(anexo.temPeso && anexo.pesoTotal > 0) simForm.peso = String(anexo.pesoTotal);
        simResult = null;
        toast(`Orçamento lido: ${anexo.itens.length} itens${anexo.temPeso ? ' · ' + fmtKg(anexo.pesoTotal) : ''}.`, 'success');
      }catch(e){ console.error(e); toast(erroMsg(e), 'error'); }
      lendoPdf = false; render();
    },
    removerAnexo(){
      if(anexo && String(simForm.peso) === String(anexo.pesoTotal)) simForm.peso = '';
      anexo = null; simResult = null; render();
    },

    // --- simulador ---
    openCombo(){ if(ui.comboOpen) return; ui.comboOpen = true; render(); const el=document.getElementById('f-cidade'); el.focus(); el.setSelectionRange(9999,9999); },
    onCidadeInput(v){ simForm.cidadeQuery = v; simForm.cidadeId = null; ui.comboOpen = true; render(); const el=document.getElementById('f-cidade'); el.focus(); el.setSelectionRange(9999,9999); },
    pickCidade(id){ const c = cidade(id); simForm.cidadeId = id; simForm.cidadeQuery = c.nome + ' — ' + transp(c.transportadora_id).nome; ui.comboOpen = false; render(); },
    setSimField(field, val){ simForm[field] = val; },
    async runSimulacao(){
      if(!simForm.cidadeId){ toast('Selecione uma cidade da lista.', 'error'); return; }
      const pesoInformado = String(simForm.peso).trim() !== '' && parseFloat(simForm.peso) > 0;
      const peso = pesoInformado ? parseFloat(simForm.peso) : PESO_PADRAO_KG;
      const valor = String(simForm.valor).trim()!=='' ? parseFloat(simForm.valor) : null;
      const volumes = String(simForm.volumes).trim()!=='' ? parseInt(simForm.volumes,10) : null;
      ui.busy = true; ui.comboOpen = false; render();
      try{
        const { data, error } = await sb.rpc('simular_frete', {
          p_cidade_id: simForm.cidadeId, p_peso: peso, p_valor: valor, p_volumes: volumes,
          p_numero_orcamento: anexo ? anexo.numero : null, p_cliente: anexo ? anexo.cliente : null,
          p_itens: anexo ? anexo.itens.map(i=>({codigo:i.codigo, descricao:i.descricao, unidade:i.unidade, quantidade:i.quantidade, peso_unit:i.peso_unit, peso_total:i.peso_total, valor_total:i.valor_total})) : null,
          p_peso_padrao: !pesoInformado,
        });
        if(error) throw error;
        simResult = data;
        S.historicoCarregado = false;   // força recarregar na próxima visita
        toast('Simulação calculada e salva no histórico.', 'success');
      }catch(e){ toast(erroMsg(e), 'error'); }
      ui.busy = false; render();
    },
    resetSimulacao(){ simForm = {cidadeId:null, cidadeQuery:'', peso: anexo && anexo.temPeso ? String(anexo.pesoTotal) : '', valor:'', volumes:''}; simResult=null; render(); },

    // --- histórico ---
    async recarregarHistorico(){ S.historicoCarregado = false; render(); try{ await carregarHistorico(); }catch(e){ toast(erroMsg(e),'error'); } render(); },
    openHistoricoModal(id){ ui.modal='historico'; ui.historicoId=id; render(); },
    async deleteHistorico(id){
      if(!confirm('Excluir este registro do histórico? Essa ação não pode ser desfeita.')) return;
      const { error } = await sb.from('historico_simulacoes').delete().eq('id', id);
      if(error){ toast(erroMsg(error),'error'); return; }
      S.historico = S.historico.filter(h=>h.id!==id); toast('Registro excluído.','success'); render();
    },

    // --- cidades ---
    openCidadeModal(id){
      cidadeDraft = id ? {...cidade(id)} : {id:null, transportadora_id:(S.transportadoras[0]||{}).id, regiao_rota:'', nome:'', km:'', dias_coleta:'', prazo_entrega:'', prazo_entrega_consolidado:''};
      ui.modal='cidade'; render();
    },
    setDraft(tipo, k, v){ const d = tipo==='cidade' ? cidadeDraft : userDraft; d[k] = v; },
    async saveCidade(){
      const d = cidadeDraft;
      if(!String(d.nome).trim()){ toast('Informe o nome da cidade.', 'error'); return; }
      const km = parseFloat(d.km);
      if(isNaN(km) || km < 0){ toast('Informe o km (número maior ou igual a zero).', 'error'); return; }
      const row = { transportadora_id:d.transportadora_id, regiao_rota:d.regiao_rota||null, nome:String(d.nome).trim(), km, dias_coleta:d.dias_coleta||null, prazo_entrega:d.prazo_entrega||null, prazo_entrega_consolidado:d.prazo_entrega_consolidado||null };
      ui.busy = true; render();
      const res = d.id ? await sb.from('cidades').update(row).eq('id', d.id).select().single() : await sb.from('cidades').insert(row).select().single();
      ui.busy = false;
      if(res.error){ toast(erroMsg(res.error),'error'); render(); return; }
      const saved = {...res.data, km:num(res.data.km)};
      if(d.id) S.cidades = S.cidades.map(c=>c.id===d.id?saved:c); else S.cidades.push(saved);
      ui.modal=null; toast('Cidade salva.', 'success'); render();
    },
    async deleteCidade(id){
      const c = cidade(id);
      if(!confirm(`Excluir a cidade ${c.nome}?`)) return;
      const { error } = await sb.from('cidades').delete().eq('id', id);
      if(error){ toast(erroMsg(error),'error'); return; }
      S.cidades = S.cidades.filter(x=>x.id!==id); toast('Cidade excluída.','success'); render();
    },

    // --- parâmetros ---
    setParam(k, v){ paramDraft[k] = v; },
    descartarParametros(){ paramDraft = null; render(); },
    async saveParametros(){
      const campos = ['fiorino_manutencao_km','fiorino_pneus_km','fiorino_depreciacao_km','fiorino_seguro_km','fiorino_consumo_km_l','fiorino_capacidade_kg',
        'iveco_manutencao_km','iveco_pneus_km','iveco_depreciacao_km','iveco_seguro_doc_km','iveco_consumo_km_l','iveco_capacidade_kg',
        'preco_litro','pct_frota','pct_transp','frete_min','ad_valorem','preco_volume'];
      const row = {};
      for(const k of campos){
        const v = parseFloat(paramDraft[k]);
        if(isNaN(v) || v < 0){ toast('Valor inválido em um dos campos.', 'error'); return; }
        row[k] = PCT_FIELDS.includes(k) ? v/100 : v;
      }
      if(row.fiorino_consumo_km_l<=0 || row.iveco_consumo_km_l<=0 || row.pct_frota<=0){ toast('Consumo e teto do frete próprio precisam ser maiores que zero.', 'error'); return; }
      row.atualizado_em = new Date().toISOString(); row.atualizado_por = S.perfil.id;
      ui.busy = true; render();
      const { data, error } = await sb.from('parametros_custo').update(row).eq('id',1).select().single();
      ui.busy = false;
      if(error){ toast(erroMsg(error),'error'); render(); return; }
      S.parametros = data; paramDraft = null;
      S.capacidades = {fiorino_kg:num(data.fiorino_capacidade_kg), iveco_kg:num(data.iveco_capacidade_kg)};
      toast('Parâmetros atualizados.', 'success'); render();
    },

    // --- cadastros ---
    async addTransportadora(){
      const nome = prompt('Nome da nova transportadora:');
      if(!nome || !nome.trim()) return;
      const { data, error } = await sb.from('transportadoras').insert({nome:nome.trim()}).select('id,nome').single();
      if(error){ toast(erroMsg(error),'error'); return; }
      S.transportadoras.push(data); render();
    },
    async renameTransportadora(id){
      const t = transp(id); const nome = prompt('Novo nome:', t.nome);
      if(!nome || !nome.trim() || nome.trim()===t.nome) return;
      const { error } = await sb.from('transportadoras').update({nome:nome.trim()}).eq('id', id);
      if(error){ toast(erroMsg(error),'error'); return; }
      t.nome = nome.trim(); render();
    },
    async deleteTransportadora(id){
      if(S.cidades.some(c=>c.transportadora_id===id)){ toast('Não é possível excluir: há cidades vinculadas a esta transportadora.', 'error'); return; }
      if(!confirm('Excluir esta transportadora?')) return;
      const { error } = await sb.from('transportadoras').delete().eq('id', id);
      if(error){ toast(erroMsg(error),'error'); return; }
      S.transportadoras = S.transportadoras.filter(t=>t.id!==id); render();
    },
    async setFaixaField(id, field, val){
      const f = S.faixas.find(x=>x.id===id);
      const v = field==='limite_km' ? parseFloat(val) : String(val).trim();
      if(field==='limite_km' && (isNaN(v) || v<=0)){ toast('Limite inválido.','error'); render(); return; }
      if(field==='rotulo' && !v){ toast('Rótulo não pode ficar vazio.','error'); render(); return; }
      const { error } = await sb.from('faixas_km').update({[field]: v}).eq('id', id);
      if(error){ toast(erroMsg(error),'error'); render(); return; }
      f[field] = v; toast('Faixa atualizada.','success'); render();
    },

    // --- usuários ---
    openUserModal(id){
      const p = id ? S.perfis.find(x=>x.id===id) : null;
      userDraft = p ? {id:p.id, nome:p.nome, email:p.email||'', senha:'', papel:p.papel, ativo:p.ativo} : {id:null, nome:'', email:'', senha:'', papel:'vendedor', ativo:true};
      ui.modal = 'user'; render();
    },
    async saveUser(){
      const d = userDraft;
      if(!d.nome.trim()){ toast('Informe o nome.','error'); return; }
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email.trim())){ toast('Informe um e-mail válido.','error'); return; }
      if(!d.id && d.senha.length < 6){ toast('A senha inicial precisa ter pelo menos 6 caracteres.','error'); return; }
      if(d.id && d.senha && d.senha.length < 6){ toast('A nova senha precisa ter pelo menos 6 caracteres.','error'); return; }
      const body = d.id
        ? { acao:'editar', id:d.id, nome:d.nome.trim(), email:d.email.trim(), senha:d.senha||undefined, papel:d.papel, ativo:!!d.ativo }
        : { acao:'criar', nome:d.nome.trim(), email:d.email.trim(), senha:d.senha, papel:d.papel };
      ui.busy = true; render();
      try{
        const { data, error } = await sb.functions.invoke('simufrete-usuarios', { body });
        if(error){
          let msg = error.message;
          try{ const j = await error.context.json(); if(j && j.error) msg = j.error; }catch(_){}
          throw new Error(msg);
        }
        if(data && data.error) throw new Error(data.error);
        const u = await sb.from('perfis').select('id,nome,email,papel,ativo,criado_em').order('nome');
        if(!u.error) S.perfis = u.data;
        ui.modal = null;
        toast(d.id ? 'Usuário atualizado.' : (data && data.ja_existia ? 'Este e-mail já tinha conta no sistema: o acesso ao SimuFrete foi liberado.' : 'Usuário criado. Passe o e-mail e a senha ao vendedor.'), 'success');
        if(d.id === S.perfil.id){ S.perfil.nome = d.nome.trim(); }
      }catch(e){ toast(erroMsg(e),'error'); }
      ui.busy = false; render();
    },

    closeModal(){ ui.modal=null; render(); },
    overlayClick(ev){ if(ev.target.classList.contains('overlay')) App.closeModal(); },
  };

  document.getElementById('pdf-input').addEventListener('change', e => App.onPdf(e.target.files[0]));
  document.addEventListener('click', (e)=>{
    if(ui.comboOpen && !e.target.closest('.combo')){ ui.comboOpen = false; render(); }
  });

  /* ============ Início ============ */
  (async function boot(){
    if(!sb){ S.boot = false; render(); return; }
    sb.auth.onAuthStateChange((event)=>{
      if(event === 'PASSWORD_RECOVERY'){ recuperacao = recuperacao || { erro:'', loading:false }; if(!S.boot) render(); }
      if(event === 'SIGNED_OUT' && S.perfil){ S.perfil = null; render(); }
    });
    try{
      const { data } = await sb.auth.getSession();
      if(VEIO_DE_RECUPERACAO && data.session){
        recuperacao = { erro:'', loading:false };
      } else if(data.session){
        await iniciarSessao(data.session);
      }
      if(ERRO_LINK){
        loginForm.erro = /expired|invalid/i.test(ERRO_LINK) ? 'O link do e-mail expirou ou já foi usado. Peça um novo em "Esqueci minha senha".' : ERRO_LINK;
        history.replaceState(null, '', location.pathname);
      }
    }catch(e){ loginForm.erro = erroMsg(e); }
    S.boot = false; render();
  })();
})();
</script>
</body>
</html>
